name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (Tycho)
        run: |
          mvn -v
          mvn -B -e clean verify 2>&1 | tee build.log || {
            echo "::error title=Maven build failed::$(grep -E 'ERROR|Caused by|BUILD' build.log | head -25 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: kcube-link-explorer
          path: dist/*

      # p2 업데이트 사이트를 GitHub Pages(gh-pages 브랜치)로 게시한다.
      # URL: https://leejy-jpg.github.io/kcube-link-explorer/
      - name: Publish update site to GitHub Pages
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: com.kcube.link.update-site/target/repository
          force_orphan: true

      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
